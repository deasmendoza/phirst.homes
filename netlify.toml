# Netlify reads this file and uses it instead of the build settings typed in the dashboard.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /calculator is the homepage, scrolled to the calculator (no "#" in the address).
[[redirects]]
  from = "/calculator"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/calculator/"
  to = "/index.html"
  status = 200
