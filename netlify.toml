# Netlify reads this file and uses it instead of the build settings typed in the dashboard.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The calculator now lives on the homepage.
[[redirects]]
  from = "/calculator/*"
  to = "/#calculator"
  status = 302
[[redirects]]
  from = "/calculator"
  to = "/#calculator"
  status = 302
